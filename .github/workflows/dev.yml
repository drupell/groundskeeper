# =============================================================================
# Groundskeeper — DEV gate
# -----------------------------------------------------------------------------
# Runs on pull requests targeting non-main branches and on pushes to any
# non-main branch. Lenient but fail-fast: lint, format-check, type-check,
# tests, and a frontend build. This is the "iterate here" gate; main.yml
# layers the strict security/CVE gates on top before code can reach main.
# =============================================================================

name: dev

on:
  pull_request:
    branches-ignore:
      - main
  push:
    branches-ignore:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-lint-test:
    name: Python — lint, format, tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (dev group)
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check deploy.py teardown.py backend/

      - name: Black format check
        run: uv run black --check deploy.py teardown.py backend/

      - name: Pytest
        run: uv run pytest -q

  frontend-lint-build:
    name: Frontend — lint, type-check, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npx prettier --check src/

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint .

      - name: Build
        run: npm run build
