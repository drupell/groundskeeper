# =============================================================================
# Groundskeeper — DEV gate
# -----------------------------------------------------------------------------
# Runs on pull requests targeting non-main branches and on pushes to any
# non-main branch. Lenient but fail-fast: lint, format-check, type-check,
# tests, and a frontend build. This is the "iterate here" gate; main.yml
# layers the strict security/CVE gates on top before code can reach main.
# =============================================================================

name: dev

on:
  pull_request:
    branches-ignore:
      - main
  push:
    branches-ignore:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-lint-test:
    name: Python — lint, format, tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (dev group)
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check deploy.py teardown.py backend/

      - name: Black format check
        run: uv run black --check deploy.py teardown.py backend/

      - name: Pytest
        run: uv run pytest -q

  frontend-lint-build:
    name: Frontend — lint, type-check, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npx prettier --check src/

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint .

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Deploy stage — runs ONLY on push to the `dev` branch (not feature branches,
  # not PRs). Authenticates to the dev AWS account via GitHub OIDC; no
  # long-lived secrets. deploy.py re-tags every resource with
  # project=groundskeeper + environment=dev. This is the ONLY path to dev.
  # ---------------------------------------------------------------------------
  deploy-dev:
    name: Deploy → dev AWS account
    needs: [python-lint-test, frontend-lint-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.CI_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required to request the OIDC token
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEV_DEPLOY_ROLE_ARN }}
          role-session-name: groundskeeper-deploy-dev-${{ github.run_id }}
          aws-region: us-east-1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Deploy to dev
        env:
          # Dashboard basic-auth password sourced from repo secrets. Set this
          # once in the dev environment; deploy.py reuses any existing
          # password if the env var is unset.
          GROUNDSKEEPER_DASHBOARD_PASSWORD: ${{ secrets.GROUNDSKEEPER_DEV_DASHBOARD_PASSWORD }}
        run: |
          uv run python deploy.py \
            --account ${{ secrets.AWS_DEV_ACCOUNT_ID }} \
            --region us-east-1 \
            --environment dev \
            --non-interactive \
            --yes
