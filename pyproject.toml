[project]
name = "groundskeeper"
version = "0.1.0"
description = "Personal AWS-deployed tool that automates realistic-looking GitHub commits on a repo you own."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.33",
    "rich>=15.0.0",
    "questionary>=2.1.1",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.15.18",
    "pytest>=8",
]
security = [
    "bandit>=1.7",
    "pip-audit>=2.10.1",
]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
/(
    \.venv
  | \.venv-deploy
  | \.venv-dev
  | \.groundskeeper-build
  | frontend/node_modules
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".venv",
    ".venv-deploy",
    ".venv-dev",
    ".groundskeeper-build",
    "frontend/node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]
ignore = [
    "E501",  # line length is enforced by Black
    "B008",  # function calls in argument defaults — false-positives on FastAPI-style code
]

[tool.ruff.lint.per-file-ignores]
# deploy.py / teardown.py intentionally place third-party imports after a
# uv-bootstrap block, so they opt out of "imports at top of file" and import
# sorting.
"deploy.py" = ["E402", "I001"]
"teardown.py" = ["E402", "I001"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
# Put backend/ on sys.path so tests import the Lambda code the same way the
# bundled zips do (`from shared.foo import bar`).
pythonpath = ["backend"]
